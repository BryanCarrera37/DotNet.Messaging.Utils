log.console = true
log.file = /var/log/rabbitmq/rabbitmq.log
log.file.level = debug
log.file.formatter = json

auth_backends.1 = rabbit_auth_backend_oauth2
auth_backends.2 = rabbit_auth_backend_internal

auth_oauth2.resource_server_id = rabbitmq-authenticator
auth_oauth2.issuer = https://messaging-utils-keycloak:8443/realms/development
auth_oauth2.https.verify = verify_none

auth_oauth2.token_endpoint = https://messaging-utils-keycloak:8443/realms/development/protocol/openid-connect/token
auth_oauth2.jwks_uri = https://messaging-utils-keycloak:8443/realms/development/protocol/openid-connect/certs
auth_oauth2.end_session_endpoint = https://messaging-utils-keycloak:8443/realms/development/protocol/openid-connect/logout

auth_oauth2.preferred_username_claims.1 = preferred_username
auth_oauth2.additional_scopes_key = realm_access.roles
auth_oauth2.scope_aliases.rabbitmq_admin = rabbitmq-authenticator.tag:administrator rabbitmq-authenticator.read:*/* rabbitmq-authenticator.write:*/* rabbitmq-authenticator.configure:*/*
auth_oauth2.scope_aliases.rabbitmq_monitor = rabbitmq-authenticator.tag:monitoring rabbitmq-authenticator.read:*/
auth_oauth2.scope_aliases.rabbitmq_user = rabbitmq-authenticator.read:*/* rabbitmq-authenticator.write:*/*

management.oauth_enabled = true
management.oauth_provider_url = https://messaging-utils-keycloak:8443/realms/development/.well-known/openid-configuration
management.oauth_client_id = rabbitmq-authenticator
management.oauth_client_secret = xcxqX2TDpMRzOegh0DljTuaz6svlTiip
